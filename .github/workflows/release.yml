name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: circlesac/credentials
          path: credentials-spec
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: diff -ru schemas credentials-spec/schemas
      - run: go test -race ./...
      - run: go vet ./...
      - name: Tag release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be SemVer without the v prefix" >&2
            exit 1
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
